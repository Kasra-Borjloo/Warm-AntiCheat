name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Linter Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit

  test:
    name: Test Suite (${{ matrix.os }})
    needs: [fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev g++
          echo "WARM_BUNDLED_TOOLCHAIN=/usr" >> $GITHUB_ENV
      - name: Configure Windows Toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -d "C:/msys64/ucrt64" ]; then
            echo "WARM_BUNDLED_TOOLCHAIN=C:/msys64/ucrt64" >> $GITHUB_ENV
          elif [ -d "C:/msys64/mingw64" ]; then
            echo "WARM_BUNDLED_TOOLCHAIN=C:/msys64/mingw64" >> $GITHUB_ENV
          fi
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run full test suite
        run: cargo test --workspace --verbose
