name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: warm-anticheat-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: warm-anticheat-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: warm-anticheat-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: warm-anticheat-macos-x86_64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir staging
          Copy-Item target/${{ matrix.target }}/release/warm_builder_app.exe staging/
          Copy-Item target/${{ matrix.target }}/release/warm_participant_app.exe staging/
          Copy-Item target/${{ matrix.target }}/release/warm_judge_app.exe staging/
          Copy-Item README.md staging/
          Copy-Item LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/warm_builder_app staging/
          cp target/${{ matrix.target }}/release/warm_participant_app staging/
          cp target/${{ matrix.target }}/release/warm_judge_app staging/
          cp README.md staging/
          cp LICENSE staging/
          tar -czvf ${{ matrix.artifact_name }} -C staging .

      - name: Generate Checksums
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            certutil -hashfile ${{ matrix.artifact_name }} SHA256 | grep -v "hash" | grep -v "CertUtil" | tr -d ' \r\n' > ${{ matrix.artifact_name }}.sha256
          else
            sha256sum ${{ matrix.artifact_name }} | awk '{print $1}' > ${{ matrix.artifact_name }}.sha256
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}*

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate Consolidated Checksums
        run: |
          cd release-artifacts
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
            release-artifacts/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
