name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_compiler: warm-contest-maker-windows-x86_64.zip
            artifact_no_compiler: warm-contest-maker-windows-x86_64-no-compiler.zip
            platform: windows
            arch: x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_compiler: warm-contest-maker-linux-x86_64.tar.gz
            artifact_no_compiler: warm-contest-maker-linux-x86_64-no-compiler.tar.gz
            platform: linux
            arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_compiler: warm-contest-maker-macos-arm64.tar.gz
            artifact_no_compiler: warm-contest-maker-macos-arm64-no-compiler.tar.gz
            platform: macos
            arch: aarch64
            tc_arch: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_compiler: warm-contest-maker-macos-x86_64.tar.gz
            artifact_no_compiler: warm-contest-maker-macos-x86_64-no-compiler.tar.gz
            platform: macos
            arch: x86_64
            tc_arch: darwin-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir staging
          mkdir staging/bin
          Copy-Item target/${{ matrix.target }}/release/warm_builder_app.exe staging/warm-contest-maker.exe
          Copy-Item assets/windows/x64/WebView2Loader.dll staging/WebView2Loader.dll
          Copy-Item target/${{ matrix.target }}/release/warm_participant_app.exe staging/bin/warm_participant_app.exe
          Copy-Item target/${{ matrix.target }}/release/warm_judge_app.exe staging/bin/warm_judge_app.exe
          Copy-Item assets/windows/x64/WebView2Loader.dll staging/bin/WebView2Loader.dll
          Copy-Item README.md staging/
          Copy-Item LICENSE staging/

          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.artifact_no_compiler }}

          $tcUrl = "https://github.com/skeeto/w64devkit/releases/download/v2.11.0/w64devkit-x64-2.11.0.7z.exe"
          Invoke-WebRequest -Uri $tcUrl -OutFile w64devkit.7z.exe
          7z x w64devkit.7z.exe -o"staging_tc"
          Move-Item staging_tc/w64devkit staging/bin/toolchain
          Copy-Item -Recurse staging/bin/toolchain staging/toolchain
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.artifact_compiler }}

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir staging
          mkdir -p staging/bin
          cp target/${{ matrix.target }}/release/warm_builder_app staging/warm-contest-maker
          cp target/${{ matrix.target }}/release/warm_participant_app staging/bin/warm_participant_app
          chmod +x staging/bin/warm_participant_app
          cp target/${{ matrix.target }}/release/warm_judge_app staging/bin/warm_judge_app
          chmod +x staging/bin/warm_judge_app
          chmod +x staging/warm-contest-maker
          cp README.md staging/
          cp LICENSE staging/

          tar -czvf ${{ matrix.artifact_no_compiler }} -C staging .

          mkdir -p staging/bin/toolchain staging/toolchain
          if [ "${{ runner.os }}" = "Linux" ]; then
            if curl -fL --connect-timeout 30 --retry 3 --retry-delay 2 https://github.com/xpack-dev-tools/gcc-xpack/releases/download/v14.2.0-1/xpack-gcc-14.2.0-1-linux-x64.tar.gz -o /tmp/tc.tar.gz || curl -fL --connect-timeout 30 --retry 3 --retry-delay 2 https://musl.cc/x86_64-linux-musl-native.tgz -o /tmp/tc.tar.gz; then
              tar -xzf /tmp/tc.tar.gz -C staging/bin/toolchain --strip-components=1 2>/dev/null || true
              cp -r staging/bin/toolchain/* staging/toolchain/ 2>/dev/null || true
              rm -f /tmp/tc.tar.gz
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            if curl -fL --connect-timeout 30 --retry 3 --retry-delay 2 https://github.com/xpack-dev-tools/gcc-xpack/releases/download/v14.2.0-1/xpack-gcc-14.2.0-1-${{ matrix.tc_arch }}.tar.gz -o /tmp/tc.tar.gz; then
              tar -xzf /tmp/tc.tar.gz -C staging/bin/toolchain --strip-components=1 2>/dev/null || true
              cp -r staging/bin/toolchain/* staging/toolchain/ 2>/dev/null || true
              rm -f /tmp/tc.tar.gz
            fi
          fi

          tar -czvf ${{ matrix.artifact_compiler }} -C staging .

      - name: Generate Checksums
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            certutil -hashfile ${{ matrix.artifact_compiler }} SHA256 | grep -v "hash" | grep -v "CertUtil" | tr -d ' \r\n' > ${{ matrix.artifact_compiler }}.sha256
            certutil -hashfile ${{ matrix.artifact_no_compiler }} SHA256 | grep -v "hash" | grep -v "CertUtil" | tr -d ' \r\n' > ${{ matrix.artifact_no_compiler }}.sha256
          else
            sha256sum ${{ matrix.artifact_compiler }} | awk '{print $1}' > ${{ matrix.artifact_compiler }}.sha256
            sha256sum ${{ matrix.artifact_no_compiler }} | awk '{print $1}' > ${{ matrix.artifact_no_compiler }}.sha256
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ matrix.artifact_compiler }}*
            ${{ matrix.artifact_no_compiler }}*

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate Consolidated Checksums, Manifest, and SBOM
        run: |
          cd release-artifacts
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

          node -e '
            const fs = require("fs");
            const checksums = fs.readFileSync("SHA256SUMS.txt", "utf8").trim().split("\n");
            const artifacts = checksums.map(line => {
              const parts = line.trim().split(/\s+/);
              return { sha256: parts[0], path: parts[1] };
            });
            const manifest = {
              release: process.env.GITHUB_REF_NAME || "v0.8.0",
              project: "Warm-AntiCheat",
              timestamp: new Date().toISOString(),
              artifacts,
              supported_platforms: [
                "Windows (x86_64, Windows 10/11) [Compiler & No-Compiler editions]",
                "Linux (Universal x86_64: Ubuntu, Debian, Fedora, Arch Linux) [Compiler & No-Compiler editions]",
                "macOS (Apple Silicon M1/M2/M3 & Intel x86_64, macOS 12+) [Compiler & No-Compiler editions]"
              ],
              unsupported_platforms: [
                "32-bit x86 architectures",
                "Solaris / illumos",
                "FreeBSD / OpenBSD (untested)",
                "macOS 10.15 Catalina and earlier"
              ],
              security: {
                offline_only: true,
                authenticode_ready: true,
                smartscreen_compatible: true
              }
            };
            fs.writeFileSync("release-manifest.json", JSON.stringify(manifest, null, 2));
          '

          echo '{"spdxVersion":"SPDX-2.3","name":"Warm-AntiCheat","packages":[{"name":"warm-anticheat","versionInfo":"0.8.0","licenseConcluded":"GPL-3.0-only"}]}' > sbom.spdx.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
            release-artifacts/SHA256SUMS.txt
            release-artifacts/release-manifest.json
            release-artifacts/sbom.spdx.json
          draft: false
          prerelease: false
          generate_release_notes: true
