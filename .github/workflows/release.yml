name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: warm-contest-maker-windows-x86_64.zip
            platform: windows
            arch: x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: warm-contest-maker-linux-x86_64.tar.gz
            platform: linux
            arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: warm-contest-maker-macos-arm64.tar.gz
            platform: macos
            arch: aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: warm-contest-maker-macos-x86_64.tar.gz
            platform: macos
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir staging
          mkdir staging/bin
          Copy-Item target/${{ matrix.target }}/release/warm_builder_app.exe staging/warm-contest-maker.exe
          Copy-Item assets/windows/x64/WebView2Loader.dll staging/WebView2Loader.dll
          Copy-Item target/${{ matrix.target }}/release/warm_participant_app.exe staging/bin/warm_participant_app.exe
          Copy-Item target/${{ matrix.target }}/release/warm_judge_app.exe staging/bin/warm_judge_app.exe
          Copy-Item assets/windows/x64/WebView2Loader.dll staging/bin/WebView2Loader.dll
          Copy-Item README.md staging/
          Copy-Item LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir staging
          mkdir -p staging/bin
          cp target/${{ matrix.target }}/release/warm_builder_app staging/warm-contest-maker
          cp target/${{ matrix.target }}/release/warm_participant_app staging/bin/warm_participant_app
          chmod +x staging/bin/warm_participant_app
          cp target/${{ matrix.target }}/release/warm_judge_app staging/bin/warm_judge_app
          chmod +x staging/bin/warm_judge_app
          chmod +x staging/warm-contest-maker
          cp README.md staging/
          cp LICENSE staging/
          tar -czvf ${{ matrix.artifact_name }} -C staging .

      - name: Generate Checksums
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            certutil -hashfile ${{ matrix.artifact_name }} SHA256 | grep -v "hash" | grep -v "CertUtil" | tr -d ' \r\n' > ${{ matrix.artifact_name }}.sha256
          else
            sha256sum ${{ matrix.artifact_name }} | awk '{print $1}' > ${{ matrix.artifact_name }}.sha256
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}*

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate Consolidated Checksums, Manifest, and SBOM
        run: |
          cd release-artifacts
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

          node -e '
            const fs = require("fs");
            const checksums = fs.readFileSync("SHA256SUMS.txt", "utf8").trim().split("\n");
            const artifacts = checksums.map(line => {
              const parts = line.trim().split(/\s+/);
              return { sha256: parts[0], path: parts[1] };
            });
            const manifest = {
              release: process.env.GITHUB_REF_NAME || "v0.6.0",
              project: "Warm-AntiCheat",
              timestamp: new Date().toISOString(),
              artifacts,
              supported_platforms: [
                "Windows (x86_64, Windows 10/11)",
                "Linux (Universal x86_64: Ubuntu, Debian, Fedora, Arch Linux, openSUSE, Rocky/RHEL)",
                "macOS (Apple Silicon M1/M2/M3 & Intel x86_64, macOS 12+)"
              ],
              unsupported_platforms: [
                "32-bit x86 architectures",
                "Solaris / illumos",
                "FreeBSD / OpenBSD (untested)",
                "macOS 10.15 Catalina and earlier"
              ],
              security: {
                offline_only: true,
                authenticode_ready: true,
                smartscreen_compatible: true
              }
            };
            fs.writeFileSync("release-manifest.json", JSON.stringify(manifest, null, 2));
          '

          echo '{"spdxVersion":"SPDX-2.3","name":"Warm-AntiCheat","packages":[{"name":"warm-anticheat","versionInfo":"0.6.0","licenseConcluded":"GPL-3.0-only"}]}' > sbom.spdx.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
            release-artifacts/SHA256SUMS.txt
            release-artifacts/release-manifest.json
            release-artifacts/sbom.spdx.json
          draft: false
          prerelease: false
          generate_release_notes: true
