<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Outer -->
  <path d="M256 32 L432 96 C432 288 340 416 256 480 C172 416 80 288 80 96 Z"
        fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Inner Circuit / Hash Grid -->
  <path d="M256 100 L384 148 C384 290 310 390 256 436 C202 390 128 290 128 148 Z"
        fill="#090d16" stroke="#334155" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Warm Flame / W Emblem -->
  <path d="M192 192 L224 320 L256 240 L288 320 L320 192 L296 192 L280 272 L256 210 L232 272 L216 192 Z"
        fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Integrity Node Ring -->
  <circle cx="256" cy="350" r="18" fill="url(#cyanGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="350" r="8" fill="#ffffff"/>
  <path d="M256 332 L256 295" stroke="url(#cyanGrad)" stroke-width="4"/>
  <path d="M238 350 L205 350" stroke="url(#cyanGrad)" stroke-width="4"/>
  <path d="M274 350 L307 350" stroke="url(#cyanGrad)" stroke-width="4"/>
</svg>
